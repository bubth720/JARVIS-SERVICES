name: SERVICES foundation and Android qualification
on:
  push:
    branches: [mission-001-services-foundation, mission-002a-android-qualification, feat/serv-01-services, feat/serv-02-services, feat/serv-03-services, feat/serv-04a-android-tool-port, feat/fusion-02-services, codex/prefusion-lot3-services]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: JVM regressions
        run: ./gradlew :desktop:test --no-daemon
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: jvm-results-${{ github.sha }}
          path: |
            desktop/build/test-results/test/
            build/reports/dependency-verification/
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: SDK prerequisites
        run: sdkmanager 'platforms;android-24' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build diagnostic APK
        run: ./gradlew -PwithAndroid :android:assembleDebug --no-daemon
      - name: Build instrumentation APK
        run: ./gradlew -PwithAndroid :android:assembleAndroidTest --no-daemon
      - name: Android Lint (no suppression or severity reduction)
        run: ./gradlew -PwithAndroid :android:lintDebug --no-daemon
      - name: SERV-04A Android24 adapter regressions and library
        run: ./gradlew -PwithAndroid :services-android-adapter:testDebugUnitTest :services-android-adapter:assembleDebug :services-android-adapter:assembleAndroidTest :services-android-adapter:lintDebug --no-daemon --max-workers=2
      - name: Compile shared and Android sources against API24 boot classes
        run: python3 scripts/check-api24-compile.py --sdk "$ANDROID_HOME" --dependency-cache "$HOME/.gradle/caches/modules-2/files-2.1" --output build/serv04a-api24
      - name: Artifact provenance
        run: python3 scripts/write-apk-manifest.py --output android/build/outputs/apk/manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: diagnostic-debug-${{ github.sha }}
          path: |
            android/build/outputs/apk/
            android/build/reports/lint-results-debug.*
            services-android-adapter/build/outputs/aar/
            services-android-adapter/build/outputs/apk/androidTest/
            services-saf-fixture/build/outputs/apk/
            services-android-adapter/build/test-results/testDebugUnitTest/
            services-android-adapter/build/reports/lint-results-debug.*
            build/serv04a-api24/result.json
            build/serv04a-api24/compile.log
            build/reports/dependency-verification/
  android-instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Official emulator software fallback; does not grant access to /dev/kvm.
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: SDK prerequisites
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Execute real Android instrumentation on an isolated CI emulator
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 26
          target: default
          arch: x86
          ram-size: 1536M
          emulator-build: '16555280'
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew -PwithAndroid :android:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-instrumented-${{ github.sha }}
          path: |
            android/build/outputs/androidTest-results/
            android/build/reports/androidTests/

  services-port-instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 24, arch: x86}
          - {api: 25, arch: x86}
          - {api: 26, arch: x86}
          - {api: 35, arch: x86_64}
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Build prerequisites
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Use the hosted runner KVM device for API35
        if: matrix.api == 35
        run: |
          mkdir -p build
          if [ ! -c /dev/kvm ]; then
            echo '::error::API35 requires a CI host exposing KVM; no product tests were run.'
            exit 1
          fi
          sudo chown "$(id -u)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Real SDK ports and SAF laboratory (not production activation)
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          ram-size: 1536M
          emulator-build: '16555280'
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/run-fusion02-ci.sh ${{ matrix.api }}
      - name: Publish exact test counts and failure annotations
        if: always()
        run: python3 scripts/summarize-android-tests.py --directory services-android-adapter/build/outputs/androidTest-results/connected --expected 15 --output build/fusion02-instrumentation.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: services-port-api${{ matrix.api }}-${{ github.sha }}
          path: |
            build/fusion02-instrumentation.json
            build/fusion02-readiness/
            build/fusion02-final-ui/
            build/fusion02-command.json
            build/fusion02-accel.log
            services-android-adapter/build/outputs/androidTest-results/
            services-android-adapter/build/reports/androidTests/
            services-android-adapter/build/outputs/apk/androidTest/
            services-saf-fixture/build/outputs/apk/
