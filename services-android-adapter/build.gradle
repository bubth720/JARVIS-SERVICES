plugins { id 'com.android.library' version '8.9.2' }
android {
    namespace 'fr.jarvis.services.android.adapter'
    compileSdk 35
    defaultConfig { minSdk 24; targetSdk 35; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true; checkDependencies true }
}
dependencies {
    api project(':services-portable-api')
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    constraints {
        implementation('org.bouncycastle:bcpkix-jdk15to18:1.86')
        implementation('org.bouncycastle:bcprov-jdk15to18:1.86')
        implementation('org.bouncycastle:bcutil-jdk15to18:1.86')
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.withType(Test).configureEach {
    maxHeapSize = '768m'
    systemProperty 'robolectric.logging.enabled', 'false'
    systemProperty 'robolectric.offline', System.getProperty('robolectric.offline', 'false')
    ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore','robolectric.dependency.repo.url','robolectric.dependency.dir'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
}
